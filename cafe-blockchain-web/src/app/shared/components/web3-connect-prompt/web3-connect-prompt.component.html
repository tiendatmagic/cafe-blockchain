<div class="space-y-6 p-4 sm:p-6 max-w-[1530px] mx-auto">
  <!-- BANNER YÊU CẦU KẾT NỐI VÍ WEB3 (Premium Glassmorphism) -->
  <div
    app-card
    class="bg-white/60 dark:bg-slate-900/60 backdrop-blur-md flex flex-col items-center justify-center min-h-[500px] p-8 text-center max-w-2xl mx-auto my-10"
  >
    <div
      class="w-20 h-20 rounded-full bg-purple-100 dark:bg-purple-950/40 flex items-center justify-center text-purple-650 mb-6 shadow-inner animate-bounce-slow"
    >
      <app-icon name="lock" class="h-10 w-10 text-purple-650" strokeWidth="1.8" />
    </div>
    <h4 class="text-xl font-extrabold text-slate-800 dark:text-white tracking-tight mb-3">
      {{ title }}
    </h4>
    <p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto mb-8 leading-relaxed">
      {{ description }}
    </p>
    @if (showButton) {
      <button
        app-button
        variant="primary"
        (click)="stateService.connectWalletAndSign()"
        class="gap-2"
      >
        <app-icon name="wallet" class="h-4.5 w-4.5" strokeWidth="2.5" />
        <span>{{ buttonText }}</span>
      </button>
    }
  </div>
</div>
