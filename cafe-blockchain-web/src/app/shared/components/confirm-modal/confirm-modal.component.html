@if (isOpen) {
  <div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
    <!-- Backdrop overlay tối nhẹ không blur -->
    <div (click)="onCancel()" class="fixed inset-0 bg-black/40"></div>

    <!-- Modal Content -->
    <div class="relative bg-white dark:bg-slate-900 rounded-[15px] border border-slate-200 dark:border-slate-800 p-6 max-w-sm w-full shadow-2xl text-slate-800 dark:text-slate-200 text-center animate-in fade-in zoom-in duration-200">
      
      <!-- Warning Icon SVG -->
      <div class="w-12 h-12 rounded-full bg-rose-500/10 text-rose-500 flex items-center justify-center mx-auto mb-4">
        <app-icon name="warning" class="h-6 w-6" strokeWidth="2" />
      </div>

      <!-- Tiêu đề -->
      <h4 class="text-base font-extrabold text-slate-900 dark:text-white mb-2">
        {{ title }}
      </h4>
      
      <!-- Mô tả -->
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-5 leading-relaxed">
        {{ description }}
      </p>

      <!-- Action Buttons -->
      <div class="flex gap-3">
        <button
          app-button
          variant="cancel"
          type="button"
          (click)="onCancel()"
          [disabled]="isSubmitting"
          class="flex-1"
        >
          {{ cancelText }}
        </button>
        <button
          app-button
          [variant]="confirmVariant"
          type="button"
          (click)="onConfirm()"
          [loading]="isSubmitting"
          class="flex-1 shadow-md"
        >
          <span>{{ confirmText }}</span>
        </button>
      </div>
    </div>
  </div>
}
