<div
  [class.pointer-events-none]="!isOpen"
  class="fixed inset-0 z-50 flex justify-end overflow-hidden pointer-events-none"
>
  <!-- Backdrop overlay tối nhẹ không blur -->
  <div
    (click)="onClose()"
    [class.opacity-100]="isOpen"
    [class.opacity-0]="!isOpen"
    [class.pointer-events-auto]="isOpen"
    [class.pointer-events-none]="!isOpen"
    class="fixed inset-0 bg-black/40 transition-opacity duration-300 opacity-0 pointer-events-none"
  ></div>

  <!-- Drawer Panel Content -->
  <div
    [style.transform]="isOpen ? 'translateX(0)' : 'translateX(100%)'"
    style="transform: translateX(100%)"
    class="relative w-full max-w-md bg-white dark:bg-slate-900 border-l border-slate-200/80 dark:border-slate-800 shadow-2xl transition-transform duration-300 ease-out flex flex-col h-full z-10 pointer-events-auto text-slate-800 dark:text-slate-200"
  >
    <!-- Header -->
    <div
      class="p-5 border-b border-slate-100 dark:border-slate-800/60 shrink-0 flex items-center justify-between"
    >
      <h4 class="text-base font-extrabold text-slate-800 dark:text-white">
        {{ title }}
      </h4>
      <button
        type="button"
        (click)="onClose()"
        class="w-7 h-7 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
      >
          <app-icon name="close" class="h-4.5 w-4.5" strokeWidth="2.5" />
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto p-5 no-scrollbar min-h-0 text-left">
      <ng-content></ng-content>
    </div>
  </div>
</div>
