<div
  class="fixed inset-0 z-[99999] flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4 font-sans animate-in fade-in duration-300"
>
  <div
    class="w-full max-w-md bg-white/70 dark:bg-slate-900/70 backdrop-blur-md border border-slate-200/50 dark:border-slate-800/50 rounded-2xl p-8 text-center shadow-2xl shadow-[var(--dynamic-primary)]/10 flex flex-col items-center"
  >
    <!-- Icon -->
    <div
      class="w-20 h-20 rounded-2xl flex items-center justify-center mb-6 animate-pulse bg-purple-50 dark:bg-purple-950/40 text-[var(--dynamic-primary)]"
    >
      <!-- Icon Bảo trì SVG bánh răng/cờ lê -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-10 h-10"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766l.002-.001a2.25 2.25 0 011.961.222l.01.007a2.25 2.25 0 01.83 2.542l-.001.002A2.251 2.251 0 0115.8 15.01l-4.38 2.255a1.875 1.875 0 00-.916.916l-2.255 4.38a2.25 2.25 0 01-2.915 1.077L5.33 23.63a2.25 2.25 0 01-1.077-2.915l2.255-4.38a1.875 1.875 0 00.916-.916l4.38-2.255zM11.42 15.17L5.33 9.08a2.652 2.652 0 113.75-3.75l6.09 6.09"
        />
      </svg>
    </div>

    <h1 class="text-xl font-black text-slate-800 dark:text-white uppercase mb-2.5 tracking-tight">
      Hệ thống đang bảo trì
    </h1>

    <p class="text-sm font-bold text-slate-500 dark:text-slate-400 mb-8 leading-relaxed max-w-xs">
      Hệ thống đang trong thời gian nâng cấp hệ thống, bạn quay lại sau nhé
    </p>

    <!-- Nút Thử lại -->
    <button
      app-button
      variant="primary"
      (click)="retryConnection()"
      class="w-full py-3 text-sm font-extrabold shadow-lg shadow-[var(--dynamic-primary)]/20 active:scale-95 transition-all"
    >
      Thử lại
    </button>
  </div>
</div>
