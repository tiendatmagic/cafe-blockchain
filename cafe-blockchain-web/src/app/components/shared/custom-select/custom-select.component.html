<div class="relative {{ containerClass }}" [class.opacity-60]="disabled">
  @if (label) {
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block mb-1.5">{{ label }}</label>
  }

  <!-- Nút bấm Kích hoạt Dropdown -->
  <button
    type="button"
    (click)="toggleOpen()"
    [disabled]="disabled"
    class="{{ triggerClass }} flex items-center justify-between px-4 text-left transition-all relative"
    [class.border-[var(--dynamic-primary)]]="isOpen()"
    [class.cursor-not-allowed]="disabled"
  >
    <span class="font-semibold truncate" [class.text-slate-450]="value === null || value === undefined || value === '' || value === 0">
      {{ selectedLabel || placeholder }}
    </span>
    <!-- SVG Mũi tên xoay hướng chuyển động mượt mà -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4 text-slate-450 transition-transform duration-200 shrink-0 ml-2"
      [class.rotate-180]="isOpen()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2.5"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>

  <!-- Khối Dropdown Menu Danh sách Lựa chọn -->
  @if (isOpen()) {
    <div
      class="bg-white dark:bg-slate-900 border border-slate-200/85 dark:border-slate-800/85 rounded-xl shadow-xl animate-in fade-in slide-in-from-top-1 duration-150 flex flex-col overflow-hidden"
      [ngStyle]="dropdownStyle()"
    >
      <!-- Ô Tìm kiếm nhanh tích hợp trong dropdown (nếu showSearch = true) -->
      @if (showSearch) {
        <div class="p-2 border-b border-slate-100 dark:border-slate-800 flex items-center gap-2 shrink-0 bg-slate-50/50 dark:bg-slate-950/40">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-3.5 w-3.5 text-slate-400 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            placeholder="Tìm kiếm..."
            class="w-full bg-transparent text-xs border-0 p-1 outline-none text-slate-800 dark:text-white"
          />
        </div>
      }

      <!-- Danh sách hiển thị các Options cuộn mượt -->
      <div class="overflow-y-auto no-scrollbar flex-1 py-1">
        @if (filteredOptions().length === 0) {
          <div class="px-4 py-3 text-center text-xs text-slate-400 italic">
            Không tìm thấy tùy chọn nào
          </div>
        }
        @for (opt of filteredOptions(); track getOptionValue(opt)) {
          <button
            type="button"
            (click)="selectOption(opt)"
            class="w-full flex items-center justify-between px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/50 text-xs font-semibold text-slate-700 dark:text-slate-350 text-left transition-colors"
          >
            <span class="truncate">{{ getOptionLabel(opt) }}</span>
            
            <!-- Checkmark SVG hiển thị bên cạnh option được chọn -->
            @if (compareValues(getOptionValue(opt), value)) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 text-[var(--dynamic-primary)] animate-in fade-in duration-200 shrink-0 ml-2"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="3"
                  d="M5 13l4 4L19 7"
                />
              </svg>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
