@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop overlay tối nhẹ không blur -->
    <div (click)="onClose()" class="fixed inset-0 bg-black/40"></div>

    <!-- Modal Content -->
    <div 
      [class]="'relative bg-white dark:bg-slate-900 rounded-[15px] border border-slate-200 dark:border-slate-800 p-6 w-full shadow-2xl text-slate-800 dark:text-slate-200 animate-in fade-in zoom-in duration-200 flex flex-col max-h-[90vh] ' + getSizeClass()"
    >
      <!-- Header -->
      <div class="flex items-center justify-between pb-3.5 border-b border-slate-100 dark:border-slate-800/60 shrink-0">
        <h3 class="text-base font-extrabold text-slate-800 dark:text-white select-none">
          {{ title }}
        </h3>
        <button
          type="button"
          (click)="onClose()"
          class="w-7 h-7 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-250 transition-colors"
        >
          <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="flex-1 overflow-y-auto py-4.5 no-scrollbar min-h-0 text-left">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
