@if (isOpen) {
  <div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
    <!-- Backdrop overlay tối nhẹ không blur -->
    <div (click)="onCancel()" class="fixed inset-0 bg-black/40"></div>

    <!-- Modal Content -->
    <div class="relative bg-white dark:bg-slate-900 rounded-[15px] border border-slate-200 dark:border-slate-800 p-6 max-w-sm w-full shadow-2xl text-slate-800 dark:text-slate-200 text-center animate-in fade-in zoom-in duration-200">
      
      <!-- Warning Icon SVG -->
      <div class="w-12 h-12 rounded-full bg-rose-500/10 text-rose-500 flex items-center justify-center mx-auto mb-4">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>

      <!-- Tiêu đề -->
      <h4 class="text-base font-extrabold text-slate-900 dark:text-white mb-2">
        {{ title }}
      </h4>
      
      <!-- Mô tả -->
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-5 leading-relaxed">
        {{ description }}
      </p>

      <!-- Action Buttons -->
      <div class="flex gap-3">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isSubmitting"
          class="btn-cancel flex-1"
        >
          {{ cancelText }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="isSubmitting"
          [class]="confirmButtonClass + ' flex-1 shadow-md'"
        >
          @if (isSubmitting) {
            <div class="w-3.5 h-3.5 rounded-full border-2 border-white/30 border-t-white animate-spin"></div>
            <span>Đang xử lý...</span>
          } @else {
            <span>{{ confirmText }}</span>
          }
        </button>
      </div>
    </div>
  </div>
}
