<div class="flex items-center gap-1.5 flex-wrap">
  @for (preset of presets; track preset.value) {
    <button
      type="button"
      (click)="onSelect(preset.value)"
      [style.background-color]="activePreset === preset.value ? 'var(--dynamic-primary)' : ''"
      [style.color]="activePreset === preset.value ? 'white' : ''"
      [ngClass]="activePreset !== preset.value
        ? 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
        : ''"
      class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:scale-[1.02] active:scale-95 whitespace-nowrap"
    >
      {{ preset.label }}
    </button>
  }
</div>
