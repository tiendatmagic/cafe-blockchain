<div class="space-y-6 p-4 sm:p-6 max-w-[1530px] mx-auto">
  <!-- BANNER YÊU CẦU KẾT NỐI VÍ WEB3 (Premium Glassmorphism) -->
  <div class="flex flex-col items-center justify-center min-h-[500px] p-8 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md border border-slate-200/50 dark:border-slate-800/50 rounded-3xl shadow-lg text-center max-w-2xl mx-auto my-10 animate-in fade-in zoom-in-95 duration-300">
    <div class="w-20 h-20 rounded-full bg-purple-100 dark:bg-purple-950/40 flex items-center justify-center text-purple-650 mb-6 shadow-inner animate-bounce-slow">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-purple-650" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>
    <h4 class="text-xl font-extrabold text-slate-800 dark:text-white tracking-tight mb-3">{{ title }}</h4>
    <p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto mb-8 leading-relaxed">
      {{ description }}
    </p>
    <button
      (click)="stateService.connectWalletAndSign()"
      class="flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-r from-[var(--dynamic-primary)] to-[var(--dynamic-secondary)] text-white font-extrabold text-xs shadow-lg shadow-[var(--dynamic-primary)]/25 hover:shadow-[var(--dynamic-primary)]/40 hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 5h10a2 2 0 012 2v10a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2z" />
      </svg>
      <span>KẾT NỐI VÍ BLOCKCHAIN</span>
    </button>
  </div>
</div>
