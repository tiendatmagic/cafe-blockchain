<div class="relative w-full">
  <!-- Label nếu có -->
  <label *ngIf="label" class="text-xs font-bold text-slate-400 uppercase tracking-wide block mb-1.5">
    {{ label }}
  </label>

  <!-- Ô hiển thị ngày (Bấm vào để mở lịch) -->
  <div
    (click)="toggleOpen($event)"
    [class.opacity-50]="disabled"
    [class.pointer-events-none]="disabled"
    [class.border-[var(--color-primary)]]="isOpen()"
    [class.ring-1]="isOpen()"
    [class.ring-[var(--color-primary)]/20]="isOpen()"
    class="flex items-center justify-between h-[42px] w-full text-sm font-semibold rounded-xl bg-slate-50 dark:bg-slate-950/40 border border-slate-200/40 dark:border-slate-800/40 text-slate-800 dark:text-white px-4 cursor-pointer select-none transition-all duration-200 hover:border-slate-300 dark:hover:border-slate-700/60"
  >
    <span [class.text-slate-400]="!selectedDate" class="truncate font-semibold text-xs sm:text-sm">
      {{ displayValue() || placeholder }}
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 text-slate-400 dark:text-slate-500 shrink-0 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
    </svg>
  </div>

  <!-- Popup lịch tháng -->
  <div
    *ngIf="isOpen()"
    class="bg-white/95 dark:bg-slate-900/95 border border-slate-200/50 dark:border-slate-800/50 rounded-2xl shadow-xl p-4 backdrop-blur-md transition-all duration-200"
    [ngStyle]="dropdownStyle()"
  >
    <!-- Header chuyển tháng -->
    <div class="flex items-center justify-between mb-4">
      <button
        (click)="prevMonth($event)"
        class="w-7 h-7 rounded-lg border border-slate-100 dark:border-slate-800/60 flex items-center justify-center text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all cursor-pointer active:scale-90"
      >
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <span class="text-xs font-extrabold text-slate-800 dark:text-white select-none">
        {{ monthLabel }}
      </span>

      <button
        (click)="nextMonth($event)"
        class="w-7 h-7 rounded-lg border border-slate-100 dark:border-slate-800/60 flex items-center justify-center text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all cursor-pointer active:scale-90"
      >
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <!-- Lưới Thứ (Tuần) -->
    <div class="grid grid-cols-7 gap-1 text-center mb-2">
      <span *ngFor="let dayName of daysOfWeek" class="text-[10px] font-black text-slate-400 uppercase select-none py-1">
        {{ dayName }}
      </span>
    </div>

    <!-- Lưới ngày (42 ngày) -->
    <div class="grid grid-cols-7 gap-1 text-center">
      <button
        *ngFor="let day of daysArray()"
        (click)="selectDate(day.dateStr, day.disabled, $event)"
        [disabled]="day.disabled"
        [class]="
          selectedDate === day.dateStr
            ? 'bg-[var(--color-primary)] text-white font-black shadow-md shadow-[var(--color-primary)]/20'
            : day.isCurrentMonth
              ? 'text-slate-800 dark:text-slate-200 font-bold hover:bg-slate-100 dark:hover:bg-slate-800/60'
              : 'text-slate-300 dark:text-slate-700 font-medium hover:bg-slate-50 dark:hover:bg-slate-900/30'
        "
        [class.border]="day.isToday && selectedDate !== day.dateStr"
        [class.border-[var(--color-primary)]/40]="day.isToday && selectedDate !== day.dateStr"
        [class.opacity-35]="day.disabled"
        [class.cursor-not-allowed]="day.disabled"
        class="w-8 h-8 text-[11px] rounded-xl flex items-center justify-center transition-all cursor-pointer active:scale-95"
      >
        {{ day.day }}
      </button>
    </div>
  </div>
</div>
