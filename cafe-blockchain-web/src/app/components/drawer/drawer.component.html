<div 
  [class.pointer-events-none]="!isOpen"
  class="fixed inset-0 z-50 flex justify-end"
>
  <!-- Backdrop overlay tối nhẹ không blur -->
  <div 
    (click)="onClose()" 
    [class.opacity-100]="isOpen"
    [class.opacity-0]="!isOpen"
    [class.pointer-events-auto]="isOpen"
    [class.pointer-events-none]="!isOpen"
    class="fixed inset-0 bg-black/40 transition-opacity duration-300"
  ></div>

  <!-- Drawer Panel Content -->
  <div
    [class.translate-x-0]="isOpen"
    [class.translate-x-full]="!isOpen"
    class="relative w-full max-w-md bg-white dark:bg-slate-900 border-l border-slate-200/80 dark:border-slate-800 shadow-2xl transition-transform duration-300 ease-out flex flex-col h-full z-10 pointer-events-auto text-slate-800 dark:text-slate-200"
  >
    <!-- Header -->
    <div class="p-5 border-b border-slate-100 dark:border-slate-800/60 shrink-0 flex items-center justify-between">
      <h3 class="text-sm font-extrabold uppercase text-[var(--dynamic-primary)] select-none">
        {{ title }}
      </h3>
      <button
        type="button"
        (click)="onClose()"
        class="w-7 h-7 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-250 transition-colors"
      >
        <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto p-5 no-scrollbar min-h-0 text-left">
      <ng-content></ng-content>
    </div>
  </div>
</div>
