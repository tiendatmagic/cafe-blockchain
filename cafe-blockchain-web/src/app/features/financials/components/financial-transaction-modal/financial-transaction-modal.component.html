<div class="space-y-4">
  <!-- Loại giao dịch (Pill Segmented Switch) -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Loại phiếu thu chi</label
    >
    <app-tab-group
      [options]="transactionModalTypeOptions"
      [activeValue]="transactionForm().type"
      (valueChange)="updateTransactionForm('type', $event)"
    ></app-tab-group>
  </div>

  <!-- Số tiền -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Số tiền (VND) <span class="text-rose-500">*</span></label
    >
    <input
      type="number"
      [(ngModel)]="transactionForm().amount"
      placeholder="Ví dụ: 100000..."
      class="form-input font-extrabold"
    />
  </div>

  <!-- Hạng mục -->
  <div class="space-y-1.5 relative">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Hạng mục / Phân loại <span class="text-rose-500">*</span></label
    >

    <!-- Trigger Button -->
    <button
      type="button"
      (click)="isCategoryDropdownOpen.set(!isCategoryDropdownOpen())"
      class="w-full form-input flex items-center justify-between px-4 text-left transition-all"
      [class.border-[var(--color-primary)]]="isCategoryDropdownOpen()"
    >
      <span class="font-semibold" [class.text-slate-400]="!transactionForm().category">
        {{ transactionForm().category || 'Chọn hạng mục...' }}
      </span>
      <app-icon name="chevron-down" class="h-4 w-4 text-slate-400 transition-transform duration-200 shrink-0" [strokeWidth]="2.5"></app-icon>
    </button>

    <!-- Dropdown Menu -->
    @if (isCategoryDropdownOpen()) {
      <div
        class="absolute left-0 right-0 mt-1.5 z-[60] max-h-60 overflow-y-auto bg-white dark:bg-slate-900 border border-slate-200/85 dark:border-slate-800/85 rounded-2xl shadow-xl py-1.5 animate-in fade-in slide-in-from-top-1 duration-150 no-scrollbar"
      >
        @for (
          cat of [
            'Bán hàng POS',
            'Nhập nguyên liệu',
            'Tiền mặt bằng',
            'Tiền điện nước',
            'Lương nhân viên',
            'Chi phí khác',
          ];
          track cat
        ) {
          <button
            type="button"
            (click)="selectCategory(cat)"
            class="w-full flex items-center justify-between px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/50 text-xs font-semibold text-slate-700 dark:text-slate-300 text-left transition-colors"
          >
            <span>{{ cat }}</span>
            @if (transactionForm().category === cat) {
              <app-icon name="check" class="h-4 w-4 text-[var(--dynamic-primary)] animate-in fade-in duration-200" [strokeWidth]="3"></app-icon>
            }
          </button>
        }
      </div>
    }
  </div>

  <!-- Ngày giao dịch -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Ngày giao dịch <span class="text-rose-500">*</span></label
    >
    <app-custom-date-picker
      [selectedDate]="transactionForm().transaction_date"
      (selectedDateChange)="transactionForm.update(f => ({ ...f, transaction_date: $event }))"
      placeholder="Chọn ngày giao dịch"
    ></app-custom-date-picker>
  </div>

  <!-- Mô tả ngắn -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Mô tả chi tiết / Ghi chú</label
    >
    <textarea
      [(ngModel)]="transactionForm().description"
      placeholder="Nhập mô tả cho giao dịch..."
      rows="2"
      class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950/40 border border-slate-200/40 dark:border-slate-800/40 text-sm focus:outline-none focus:border-[var(--color-primary)] text-slate-800 dark:text-white resize-none transition-all duration-200"
    ></textarea>
  </div>

  <!-- Checkbox Đồng bộ Blockchain (Chỉ khi Thêm mới) -->
  @if (transactionModalType === 'add') {
    <div class="pt-1 px-1">
      <app-custom-checkbox
        [checked]="isSyncFinanceToBlockchainChecked()"
        (checkedChange)="isSyncFinanceToBlockchainChecked.set($event)"
        [label]="'Đồng bộ phiếu ' + (transactionForm().type === 'thu' ? 'thu' : 'chi') + ' lên Blockchain'"
      ></app-custom-checkbox>
    </div>
  }

  <!-- Footer Buttons -->
  <div class="flex gap-3 pt-2">
    <button
      app-button
      variant="cancel"
      (click)="modalRef.close()"
      [disabled]="isTransactionSaving()"
      class="flex-1"
    >
      Hủy bỏ
    </button>
    <button
      app-button
      variant="primary"
      (click)="saveTransaction()"
      [loading]="isTransactionSaving()"
      class="flex-1 shadow-md"
    >
      <span>Ghi nhận</span>
    </button>
  </div>
</div>
