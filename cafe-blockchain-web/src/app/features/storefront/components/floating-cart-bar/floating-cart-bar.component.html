<div
  app-card
  class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[500] w-[calc(100%-2rem)] max-w-lg flex items-center justify-between p-3.5"
>
  <div class="flex items-center gap-3">
    <!-- Huy hiệu số lượng -->
    <div
      class="w-10 h-10 rounded-xl bg-[var(--dynamic-primary)] text-white flex items-center justify-center relative shrink-0"
    >
      <app-icon name="cart" class="w-5 h-5" [strokeWidth]="2.5"></app-icon>
      <span
        class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white dark:border-slate-900 shadow-sm animate-pulse"
      >
        {{ cartCount }}
      </span>
    </div>
    <div class="flex flex-col select-none">
      <span
        class="text-[10px] text-slate-400 dark:text-slate-500 font-bold uppercase leading-none"
        >Tổng giỏ hàng</span
      >
      <span class="text-sm font-black text-emerald-600 dark:text-emerald-400 mt-0.5 font-mono">
        {{ cartTotal | vnd }}
      </span>
    </div>
  </div>

  <button app-button variant="primary" type="button" (click)="checkout.emit()">
    Đặt hàng ngay
  </button>
</div>
