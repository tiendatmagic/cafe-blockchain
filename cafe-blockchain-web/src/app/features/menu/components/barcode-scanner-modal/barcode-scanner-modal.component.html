<div class="space-y-4 text-center">
  <p class="text-xs text-slate-400">
    Đưa mã vạch của sản phẩm vào trước camera để quét tự động.
  </p>
  <div class="relative w-full aspect-video bg-slate-950 rounded-[15px] overflow-hidden border border-slate-200/10">
    <div id="barcode-scanner-reader" class="w-full h-full"></div>
    @if (isLoading()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-white space-y-3 z-10">
        <div class="w-8 h-8 rounded-full border-4 border-white/30 border-t-white animate-spin"></div>
        <span class="text-xs font-medium">Đang khởi tạo camera...</span>
      </div>
    }
  </div>
  @if (error()) {
    <div class="text-xs text-rose-500 bg-rose-50 dark:bg-rose-950/20 p-3 rounded-xl border border-rose-200/20">
      {{ error() }}
    </div>
  }

  <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800/60 flex flex-col items-center gap-2">
    <span class="text-xs font-semibold text-slate-400">Hoặc tải ảnh chụp mã vạch lên để quét cục bộ:</span>
    <button
      app-button
      variant="secondary"
      size="sm"
      type="button"
      (click)="barcodeFileInput.click()"
      class="flex items-center gap-2 w-full justify-center"
    >
      <app-icon name="upload" class="h-4 w-4" strokeWidth="2" />
      <span>Chọn ảnh mã vạch</span>
    </button>
    <input
      #barcodeFileInput
      type="file"
      accept="image/*"
      class="hidden"
      (change)="onBarcodeFileSelected($event)"
    />
  </div>

  <div class="pt-2">
    <button
      app-button
      variant="cancel"
      (click)="onCancel()"
      class="w-full"
    >
      Hủy quét
    </button>
  </div>
</div>
