<div class="space-y-4">
  <div class="space-y-1">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide">Tên danh mục</label>
    <input
      type="text"
      [(ngModel)]="name"
      placeholder="Ví dụ: Cà phê máy, Sinh tố..."
      class="form-input font-bold"
    />
  </div>

  <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
    <button
      app-button
      variant="cancel"
      (click)="onCancel()"
      [disabled]="isLoading()"
      class="flex-1"
    >
      Hủy bỏ
    </button>
    <button
      app-button
      variant="primary"
      (click)="onSubmit()"
      [loading]="isLoading()"
      class="flex-1 shadow-md"
    >
      <span>Lưu lại</span>
    </button>
  </div>
</div>
