@if (!stateService.web3Service.walletConnected()) {
  <app-web3-connect-prompt
    title="Cấu hình cá nhân"
    description="Vui lòng kết nối ví Web3 để thay đổi các cấu hình giao diện cá nhân của bạn."
  ></app-web3-connect-prompt>
} @else {
  <div app-card class="p-6 max-w-2xl">
    <div class="space-y-6">
      <div class="flex items-center gap-3 pb-4 border-b border-slate-100 dark:border-slate-800/60">
        <div class="w-10 h-10 rounded-full bg-purple-100 dark:bg-purple-950/40 flex items-center justify-center text-purple-600 dark:text-purple-400">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="w-5 h-5" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827a1.125 1.125 0 0 1 .26 1.43l-1.297 2.247a1.125 1.125 0 0 1-1.37.491l-1.216-.456c-.356-.133-.751-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-extrabold text-slate-800 dark:text-white">Cấu hình cá nhân</h3>
          <p class="text-xs text-slate-400 dark:text-slate-500 font-semibold mt-0.5">Tùy chỉnh hành vi và giao diện ứng dụng của riêng bạn</p>
        </div>
      </div>

      <div class="space-y-6">
        <div class="space-y-1">
          <h4 class="text-sm font-extrabold text-slate-700 dark:text-slate-300">Thiết lập giao diện (UI)</h4>
          <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Thay đổi cách thức hiển thị các chuyển động trong phần mềm.</p>
        </div>

        <div class="p-4 bg-slate-50 dark:bg-slate-950/40 rounded-2xl border border-slate-100 dark:border-slate-800/40">
          <app-custom-switch
            [checked]="stateService.useSlidingEffect()"
            (checkedChange)="onSlidingEffectChange($event)"
            label="Hiệu ứng trượt menu dọc"
            description="Bật hiệu ứng trượt background mượt mà khi di chuyển giữa các danh mục dọc (Sidebar và Thực đơn Storefront). Tắt đi để có tốc độ phản hồi tĩnh nhanh hơn."
            type="full"
          ></app-custom-switch>
        </div>
      </div>
    </div>
  </div>
}
