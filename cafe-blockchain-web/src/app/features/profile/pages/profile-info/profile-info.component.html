@if (!stateService.web3Service.walletConnected()) {
  <app-web3-connect-prompt
    title="Thông tin cá nhân"
    description="Vui lòng kết nối ví Web3 để xem và quản lý thông tin hồ sơ cá nhân của bạn."
  ></app-web3-connect-prompt>
} @else {
  <div app-card class="p-6 max-w-full">
    <div class="space-y-6">
      <div class="flex items-center gap-3 pb-4 border-b border-slate-100 dark:border-slate-800/60">
        <div
          class="w-10 h-10 rounded-full bg-purple-100 dark:bg-purple-950/40 flex items-center justify-center text-purple-600 dark:text-purple-400"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            class="w-5 h-5"
            stroke-width="2.2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
            />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-extrabold text-slate-800 dark:text-white">Thông tin cá nhân</h3>
          <p class="text-xs text-slate-400 dark:text-slate-500 font-semibold mt-0.5">
            Địa chỉ ví của bạn: {{ stateService.web3Service.currentAccount() }}
          </p>
        </div>
      </div>

      <!-- Form Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Họ tên -->
        <div class="space-y-1.5 md:col-span-2">
          <label
            class="text-xs sm:text-sm font-black text-slate-700 dark:text-slate-300 uppercase tracking-wide block"
          >
            Họ và tên <span class="text-rose-500">*</span>
          </label>
          <input
            type="text"
            [ngModel]="name()"
            (ngModelChange)="onNameChange($event)"
            placeholder="Nhập họ và tên của bạn"
            class="form-input"
            [class.border-rose-500]="nameError()"
            [class.focus:border-rose-500]="nameError()"
          />
          @if (nameError()) {
            <span class="text-xs font-bold text-rose-500 block mt-1">✓ {{ nameError() }}</span>
          }
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label
            class="text-xs sm:text-sm font-black text-slate-700 dark:text-slate-300 uppercase tracking-wide block"
          >
            Địa chỉ Email
          </label>
          <input
            type="email"
            [ngModel]="email()"
            (ngModelChange)="onEmailChange($event)"
            placeholder="example@domain.com"
            class="form-input"
            [class.border-rose-500]="emailError()"
            [class.focus:border-rose-500]="emailError()"
          />
          @if (emailError()) {
            <span class="text-xs font-bold text-rose-500 block mt-1">✓ {{ emailError() }}</span>
          }
        </div>

        <!-- Số điện thoại -->
        <div class="space-y-1.5">
          <label
            class="text-xs sm:text-sm font-black text-slate-700 dark:text-slate-300 uppercase tracking-wide block"
          >
            Số điện thoại
          </label>
          <input
            type="text"
            [ngModel]="phone()"
            (ngModelChange)="onPhoneChange($event)"
            placeholder="Nhập số điện thoại liên hệ"
            class="form-input"
            [class.border-rose-500]="phoneError()"
            [class.focus:border-rose-500]="phoneError()"
          />
          @if (phoneError()) {
            <span class="text-xs font-bold text-rose-500 block mt-1">✓ {{ phoneError() }}</span>
          }
        </div>
      </div>

      <!-- Action Button -->
      <div class="pt-4 flex justify-end">
        <button
          app-button
          variant="primary"
          [disabled]="isSaving() || !isValid"
          (click)="saveProfile()"
          class="w-full sm:w-auto px-6 py-2.5 font-extrabold uppercase tracking-wide text-xs h-11"
        >
          @if (isSaving()) {
            <div class="flex items-center gap-2">
              <div
                class="w-3.5 h-3.5 rounded-full border-2 border-white/20 border-t-white animate-spin"
              ></div>
              <span>Đang lưu...</span>
            </div>
          } @else {
            <span>Cập nhật hồ sơ</span>
          }
        </button>
      </div>
    </div>
  </div>
}
