<div class="space-y-4 text-slate-800 dark:text-slate-200">
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Tên khu vực <span class="text-rose-500">*</span></label
    >
    <input
      type="text"
      [(ngModel)]="areaForm().name"
      placeholder="Ví dụ: Tầng 1, Sân vườn, VIP Room..."
      class="form-input"
    />
  </div>

  <!-- Footer Buttons -->
  <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-800/60 mt-5">
    <button
      app-button
      variant="cancel"
      (click)="modalRef.close()"
      [disabled]="isAreaSaving()"
      class="flex-1"
    >
      Hủy
    </button>
    <button
      app-button
      variant="primary"
      [loading]="isAreaSaving()"
      (click)="saveArea()"
      [disabled]="isAreaSaving()"
      class="flex-1"
    >
      <span>Lưu khu vực</span>
    </button>
  </div>
</div>
