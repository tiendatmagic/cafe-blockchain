<div class="space-y-4 text-slate-800 dark:text-slate-200">
  <!-- Tên bàn ăn -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Tên bàn ăn <span class="text-rose-500">*</span></label
    >
    <input
      type="text"
      [(ngModel)]="tableForm().name"
      placeholder="Ví dụ: Bàn 01, Bàn Ngoài trời..."
      class="form-input"
    />
  </div>

  <!-- Chọn khu vực -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Chọn khu vực trực thuộc <span class="text-rose-500">*</span></label
    >
    <app-custom-select
      [(value)]="tableForm().area_id"
      [options]="tableAreaOptions()"
      valueKey="id"
      labelKey="name"
      placeholder="-- Chọn khu vực --"
    ></app-custom-select>
  </div>

  <!-- Trạng thái mặc định -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 uppercase tracking-wide block"
      >Trạng thái bàn</label
    >
    <app-custom-select
      [(value)]="tableForm().status"
      [options]="[
        { value: 'empty', label: 'Bàn trống (Trống)' },
        { value: 'using', label: 'Đang sử dụng (Bận)' },
      ]"
      valueKey="value"
      labelKey="label"
    ></app-custom-select>
  </div>

  <!-- Footer Buttons -->
  <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-800/60 mt-5">
    <button
      app-button
      variant="cancel"
      (click)="modalRef.close()"
      [disabled]="isTableSaving()"
      class="flex-1"
    >
      Hủy
    </button>
    <button
      app-button
      variant="primary"
      [loading]="isTableSaving()"
      (click)="saveTable()"
      [disabled]="isTableSaving()"
      class="flex-1"
    >
      <span>Lưu bàn ăn</span>
    </button>
  </div>
</div>
