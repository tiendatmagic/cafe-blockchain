<div class="space-y-4 text-slate-800 dark:text-slate-200">
  <!-- Khách hàng (Dropdown search) -->
  <div class="space-y-1.5 relative">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
      >Khách hàng ghi nợ</label
    >
    <div class="relative">
      <input
        type="text"
        [ngModel]="modalCustomerSearch()"
        (ngModelChange)="modalCustomerSearch.set($event); isModalCustomerDropdownOpen.set(true)"
        (click)="isModalCustomerDropdownOpen.set(true)"
        placeholder="Gõ tên/SĐT để tìm khách hàng..."
        class="form-input"
      />
      @if (manualDebtForm().customer_id) {
        <button
          (click)="manualDebtForm.update((f) => ({ ...f, customer_id: null })); modalCustomerSearch.set('')"
          class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex items-center justify-center p-0.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors"
        >
          <app-icon name="close" class="h-3 w-3" [strokeWidth]="2.5"></app-icon>
        </button>
      }
    </div>

    <!-- Dropdown danh sách kết quả tìm khách hàng -->
    @if (isModalCustomerDropdownOpen() && modalFilteredCustomers().length > 0) {
      <div class="absolute top-full left-0 right-0 z-30 mt-1.5 max-h-48 overflow-y-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl py-1">
        @for (cust of modalFilteredCustomers(); track cust.id) {
          <button
            type="button"
            (click)="selectModalCustomer(cust)"
            class="w-full px-4 py-2 text-left text-xs hover:bg-slate-50 dark:hover:bg-slate-800/60 font-semibold text-slate-700 dark:text-slate-200 flex justify-between items-center transition-colors"
          >
            <span>{{ cust.name }}</span>
            <span class="text-[10px] text-slate-400">{{ cust.phone || '-' }}</span>
          </button>
        }
      </div>
      <!-- Click-outside handler -->
      <div (click)="isModalCustomerDropdownOpen.set(false)" class="fixed inset-0 z-20"></div>
    }
  </div>

  <!-- Số tiền nợ -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
      >Số tiền ghi nợ (đ)</label
    >
    <input
      type="number"
      [(ngModel)]="manualDebtForm().amount"
      placeholder="Nhập số tiền..."
      class="form-input font-bold"
    />
  </div>

  <!-- Ngày ghi nhận -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
      >Ngày ghi nhận</label
    >
    <app-custom-date-picker
      [selectedDate]="manualDebtForm().recorded_at"
      (selectedDateChange)="manualDebtForm.update((f) => ({ ...f, recorded_at: $event }))"
      placeholder="Chọn ngày ghi nhận"
    ></app-custom-date-picker>
  </div>

  <!-- Ghi chú -->
  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
      >Ghi chú công nợ</label
    >
    <textarea
      [(ngModel)]="manualDebtForm().note"
      rows="3"
      placeholder="Lý do nợ, thông tin tham chiếu..."
      class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200/40 dark:border-slate-800/40 bg-slate-50 dark:bg-slate-950/40 focus:outline-none focus:border-[var(--color-primary)] transition-all font-semibold text-slate-800 dark:text-white resize-none duration-200"
    ></textarea>
  </div>

  <!-- Action Buttons -->
  <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex gap-3 shrink-0">
    <button app-button variant="cancel" (click)="modalRef.close()" class="flex-1">
      Hủy bỏ
    </button>
    <button
      app-button
      variant="primary"
      (click)="saveManualDebt()"
      [loading]="isManualDebtSaving()"
      [disabled]="stateService.isLoading()"
      class="flex-1 shadow-md"
    >
      <span>Ghi nhận nợ</span>
    </button>
  </div>
</div>
